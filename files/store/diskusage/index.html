<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁盘占用</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#4f46e5;--brand-soft:#eef0ff;--brand-line:#d5d8ff;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;--danger:#d23b3b;
    --sh1:0 1px 2px rgba(16,24,40,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
  .bar{display:flex;align-items:center;gap:9px;padding:0 18px;height:54px;flex-wrap:wrap}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:8px;flex:none}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#4f46e5,#a5b4fc)}
  .spacer{flex:1}
  .stat{color:var(--t2);font-size:12.5px}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--text);transition:all .13s}
  button:hover{background:#f7f8fa}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.pri:hover{background:#4038c9}
  .seg{display:flex;gap:3px;background:#eceef2;padding:3px;border-radius:9px}
  .seg button{border:none;background:transparent;border-radius:6px;padding:5px 13px;font-size:12.5px;
    color:var(--t2);font-weight:500}
  .seg button.on{background:var(--panel);color:var(--brand);font-weight:600;box-shadow:var(--sh1)}
  main{flex:1;overflow:auto;padding:18px 22px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  .pathbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .pathbar .p{font-family:var(--mono);font-size:12.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:7px 13px;flex:1;min-width:220px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:var(--sh1)}
  .disks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .disk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 15px;
    box-shadow:var(--sh1);min-width:190px}
  .disk .m{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
  .disk .b{font-size:15px;font-weight:650;font-family:var(--mono);margin-top:3px}
  .disk .bar{height:6px;background:var(--soft);border-radius:3px;margin-top:7px;overflow:hidden}
  .disk .bar i{display:block;height:100%;background:var(--brand)}
  .disk .bar i.hi{background:var(--danger)}
  .disk .bar i.mid{background:var(--warn)}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--sh1);cursor:pointer;transition:all .12s}
  .row:hover{border-color:var(--brand-line);transform:translateX(2px)}
  .row .ic{font-size:16px;width:20px;text-align:center;flex:none}
  .row .nm{font-weight:600;font-size:13.5px;min-width:150px}
  .row .note{color:var(--t3);font-size:11.5px;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .row .sz{font-family:var(--mono);font-weight:650;font-size:13px;min-width:82px;text-align:right}
  .row .pc{font-family:var(--mono);font-size:11.5px;color:var(--t3);min-width:52px;text-align:right}
  .row .mini{width:110px;flex:none;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
  .row .mini i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#818cf8)}
  .hint{background:var(--brand-soft);border:1px solid var(--brand-line);color:#3730a3;
    border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:15px}
  .hint b{font-weight:650}
  .empty{text-align:center;padding:60px 20px;color:var(--t2)}
  .empty .big{font-size:44px;opacity:.4;display:block;margin-bottom:13px}
  .browser{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 10px 32px rgba(16,24,40,.12);width:min(560px,92vw);
    max-height:440px;overflow:auto;display:none}
  .browser .hd{padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--soft);
    font-family:var(--mono);font-size:12px;position:sticky;top:0;display:flex;gap:8px;align-items:center}
  .browser .it{padding:8px 14px;border-bottom:1px solid var(--soft);cursor:pointer;font-size:13px}
  .browser .it:hover{background:var(--brand-soft)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><i></i>磁盘占用</span>
    <div class="seg" id="seg">
      <button data-v="dirs" class="on">按目录</button>
      <button data-v="files">找大文件</button>
    </div>
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <button id="btnUp">↑ 上级</button>
    <button id="btnPick">换目录</button>
    <button class="pri" id="btnScan">扫描</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="pathbar">
      <span class="p" id="cur">—</span>
      <span id="mk"></span>
    </div>
    <div class="disks" id="disks"></div>
    <div id="body"><div class="empty"><span class="big">💽</span><b>点「扫描」开始</b>
      <span style="font-size:12.5px">从任意目录往下钻，看是谁占了空间</span></div></div>
  </div>
</main>
<div class="browser" id="browser"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { path: "", view: "dirs", data: null, home: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),1800); }

async function boot(){
  const st = await api("/api/status");
  S.home = st.home;
  S.disks = st.disks || [];
  S.notes = st.offenders || {};
  $("disks").innerHTML = (S.disks||[]).map(d => {
    const pct = parseInt(d.cap) || 0;
    const cls = pct >= 90 ? "hi" : pct >= 75 ? "mid" : "";
    return `<div class="disk">
      <div class="m">${esc(d.mount)}</div>
      <div class="b">${esc(d.used)} / ${esc(d.size)} 用了 ${esc(d.cap)}</div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(pct,100)}%"></i></div>
      <div class="m" style="margin-top:5px">可用 ${esc(d.avail)}</div></div>`;
  }).join("");
  S.path = st.home;
  scan();
}

async function scan(){
  $("body").innerHTML = `<div class="empty">扫描中…（大目录会慢一点）</div>`;
  $("btnScan").disabled = true;
  try{
    if(S.view === "files"){
      const d = await api(`/api/bigfiles?path=${encodeURIComponent(S.path)}&min_mb=20`);
      paintFiles(d);
    }else{
      const d = await api(`/api/scan?path=${encodeURIComponent(S.path)}`);
      if(d.error){ $("body").innerHTML = `<div class="empty">${esc(d.error)}</div>`; }
      else{ S.data = d; paintDirs(d); }
    }
  }catch(e){ $("body").innerHTML = `<div class="empty">失败：${esc(e.message)}</div>`; }
  $("btnScan").disabled = false;
}

function paintDirs(d){
  $("cur").textContent = d.path;
  $("stat").textContent = `${d.count} 项 · ${d.total_h} · ${d.seconds}s`;
  const offenders = d.items.filter(x => x.note && x.size > 200 * 1024 * 1024);
  let h = "";
  if(offenders.length){
    h += `<div class="hint">💡 这里面有 <b>${offenders.length}</b> 个常见的"空间黑洞"：
      ${offenders.slice(0,4).map(x => `<b>${esc(x.name)}</b>（${esc(x.note)}）`).join("、")}</div>`;
  }
  h += d.items.map(x => `<div class="row" data-p="${esc(x.path)}" data-d="${x.dir?1:0}">
    <span class="ic">${x.dir ? "📁" : "📄"}</span>
    <span class="nm">${esc(x.name)}</span>
    <span class="note">${esc(x.note || x.mtime_h)}</span>
    <span class="mini"><i style="width:${Math.min(100, x.pct * 1.4)}%"></i></span>
    <span class="pc">${x.pct}%</span>
    <span class="sz">${esc(x.size_h)}</span></div>`).join("");
  $("body").innerHTML = h || `<div class="empty">这个目录是空的</div>`;
  document.querySelectorAll(".row").forEach(el => el.onclick = () => {
    if(el.dataset.d === "1"){ S.path = el.dataset.p; scan(); }
    else post("/api/reveal", {path: el.dataset.p}).then(()=>toast("已在访达打开"));
  });
}

function paintFiles(d){
  $("cur").textContent = d.path + "（≥20MB）";
  $("stat").textContent = `${d.count} 个大文件 · 共 ${d.total_h} · ${d.seconds}s`;
  $("body").innerHTML = d.files.length ? d.files.map(f => `<div class="row"
      data-p="${esc(f.path)}" data-d="0">
    <span class="ic">📄</span>
    <span class="nm">${esc(f.name).slice(0, 40)}</span>
    <span class="note">${esc(f.path)}</span>
    <span class="sz">${esc(f.size_h)}</span>
    <span class="pc">${esc(f.mtime_h)}</span></div>`).join("")
    : `<div class="empty"><span class="big">✨</span><b>没有大于 20MB 的文件</b></div>`;
  document.querySelectorAll(".row").forEach(el => el.onclick = () =>
    post("/api/reveal", {path: el.dataset.p}).then(()=>toast("已在访达打开")));
}

$("btnScan").onclick = scan;
$("btnUp").onclick = () => {
  const p = S.path.replace(/\/[^/]+\/?$/, "") || "/";
  if(p === S.path) return toast("已经到顶了");
  S.path = p; scan();
};
$("btnPick").onclick = async e => {
  e.stopPropagation();
  const b = $("browser");
  b.style.display = "block"; b.style.left = "40px"; b.style.top = "90px";
  await browse(S.path);
};
async function browse(path){
  const b = $("browser");
  try{
    const d = await api("/api/folder?path=" + encodeURIComponent(path));
    b.innerHTML = `<div class="hd">
      <button id="bUp" style="padding:3px 9px;font-size:12px">↑</button>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(d.path)}</span>
      <button id="bPick" class="pri" style="padding:3px 10px;font-size:12px">用这个</button>
    </div>` + (d.dirs.length ? d.dirs.map(x =>
      `<div class="it" data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join("")
      : `<div class="it" style="color:var(--t3)">（没有子目录）</div>`);
    $("bUp").onclick = ev => { ev.stopPropagation(); browse(d.parent); };
    $("bPick").onclick = ev => {
      ev.stopPropagation(); S.path = d.path; b.style.display = "none"; scan();
    };
    b.querySelectorAll("[data-p]").forEach(el => el.onclick = ev => {
      ev.stopPropagation(); browse(el.dataset.p);
    });
  }catch(err){
    b.innerHTML = `<div class="it" style="color:var(--danger)">${esc(err.message)}</div>`;
  }
}
document.addEventListener("click", e => {
  const b = $("browser");
  if(b.style.display === "block" && !b.contains(e.target) && e.target.id !== "btnPick")
    b.style.display = "none";
});
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => {
  S.view = b.dataset.v;
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  scan();
});
boot();
</script>
</body>
</html>
