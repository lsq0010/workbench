<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多语言对照</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#16a34a;--brand-soft:#eafaf0;--brand-line:#b9ecc9;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;
    --danger:#d23b3b;--danger-soft:#fdecec;
    --sh1:0 1px 2px rgba(16,24,40,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
  .bar{display:flex;align-items:center;gap:10px;padding:0 18px;height:56px;flex-wrap:wrap}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:9px;flex:none}
  .brand .mk{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:13px;background:#16a34a;color:#fff}
  .spacer{flex:1}
  .tabs{display:flex;gap:3px;background:#eceef2;padding:3px;border-radius:10px}
  .tabs button{border:none;background:transparent;border-radius:7px;padding:6px 14px;
    font-size:13px;color:var(--t2);font-weight:550;cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--panel);color:var(--brand);box-shadow:var(--sh1)}
  main{flex:1;display:flex;min-height:0;overflow:hidden}
  #side{width:340px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:16px}
  #main{flex:1;overflow:auto;padding:20px 24px 60px;min-width:0}
  h4{margin:0 0 10px;font-size:12px;color:var(--t3);text-transform:uppercase;
     letter-spacing:.06em;font-weight:700}
  h4:not(:first-child){margin-top:18px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:12px;color:var(--t2);margin-bottom:5px}
  input,select{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;background:var(--panel);color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  button.b{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;color:var(--text)}
  button.b:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
  button.b.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.b:disabled{opacity:.45;cursor:not-allowed}
  .file{padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;
    cursor:pointer;font-size:12.5px;transition:all .12s}
  .file:hover{border-color:var(--brand-line);background:var(--brand-soft)}
  .file.on{border-color:var(--brand);background:var(--brand-soft)}
  .file .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .m{color:var(--t3);font-size:11px;font-family:var(--mono);margin-top:2px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 16px;
    box-shadow:var(--sh1);min-width:104px}
  .kpi .k{color:var(--t3);font-size:11.5px}
  .kpi .v{font-size:20px;font-weight:650;font-family:var(--mono);margin-top:3px}
  .langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;
    margin-bottom:18px}
  .lang{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
    box-shadow:var(--sh1)}
  .lang .top{display:flex;align-items:baseline;gap:8px}
  .lang .nm{font-weight:620;font-size:13px}
  .lang .pc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:650}
  .lang .bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}
  .lang .bar i{display:block;height:100%;background:var(--brand)}
  .lang .bar i.low{background:var(--warn)}
  .lang .sub{font-size:11.5px;color:var(--t3);margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
  th{text-align:left;color:var(--t3);font-weight:600;font-size:11.5px;padding:9px 13px;
     background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:0}
  td{padding:8px 13px;border-bottom:1px solid var(--soft);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{font-family:var(--mono);color:var(--t3);white-space:nowrap}
  .txt{font-family:var(--mono);word-break:break-all}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 8px;font-weight:600;white-space:nowrap}
  .t-crit{background:var(--danger-soft);color:var(--danger)}
  .t-warn{background:var(--warn-soft);color:var(--warn)}
  .t-info{background:#f1f3f6;color:var(--t3)}
  .t-mis{background:#f3eeff;color:#7c3aed}
  .empty{text-align:center;padding:70px 20px;color:var(--t2);font-size:13px}
  .empty .big{font-size:44px;opacity:.4;display:block;margin-bottom:13px}
  .empty b{color:var(--text);display:block;font-size:15px;margin-bottom:7px}
  .filters{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;align-items:center}
  .filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;
    padding:4px 13px;font-size:12px;cursor:pointer;color:var(--t2);font-family:inherit}
  .filters button.on{background:var(--brand-soft);border-color:var(--brand-line);
    color:var(--brand);font-weight:600}
  .toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><span class="mk">🌐</span>多语言对照</span>
    <div class="tabs" id="tabs">
      <button data-v="check" class="on">查漏查错</button>
      <button data-v="view">看表</button>
      <button data-v="diff">对比两版</button>
    </div>
    <span class="spacer"></span>
    <span style="font-size:12px;color:var(--t3);font-family:var(--mono)" id="stat"></span>
  </div>
</header>

<main>
  <aside id="side"></aside>
  <div id="main"></div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { view: "check", folder: "", file: "", sheets: [], sheet: "",
            report: null, filter: "all" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2400); }
function kb(n){ return n < 1024 ? n + " B" : (n/1024).toFixed(0) + " KB"; }

async function boot(){
  const st = await api("/api/status");
  S.folders = st.folders || [];
  S.folder = S.folders[0] || "";
  render();
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.v === S.view));
  $("side").innerHTML = `
    <h4>表格文件</h4>
    <div class="fld">
      <select id="folder">${S.folders.map(f =>
        `<option value="${esc(f)}"${f===S.folder?" selected":""}>${esc(f.replace(/^.*\//,""))}</option>`)
        .join("")}</select>
    </div>
    <div id="files"><div style="color:var(--t3);font-size:12px">读取中…</div></div>`;
  $("folder").onchange = () => { S.folder = $("folder").value; loadFiles(); };
  loadFiles();
  if(S.view === "check") renderCheck();
  else if(S.view === "view") renderView();
  else renderDiff();
}

async function loadFiles(){
  try{
    const d = await api("/api/list?folder=" + encodeURIComponent(S.folder));
    $("files").innerHTML = d.files.length ? d.files.map(f =>
      `<div class="file ${S.file===f.path?"on":""}" data-p="${esc(f.path)}">
        <div class="n">${esc(f.name)}</div>
        <div class="m">${kb(f.bytes)} · ${esc(f.mtime)}</div></div>`).join("")
      : `<div style="color:var(--t3);font-size:12px">这个目录里没有表格文件</div>`;
    document.querySelectorAll(".file").forEach(el => el.onclick = async () => {
      S.file = el.dataset.p;
      S.report = null;
      document.querySelectorAll(".file").forEach(x =>
        x.classList.toggle("on", x === el));
      try{
        const s = await api("/api/sheets?path=" + encodeURIComponent(S.file));
        S.sheets = s.sheets || [];
        S.sheet = S.sheets[0] || "";
      }catch(e){ S.sheets = []; S.sheet = ""; }
      if(S.view === "check") runCheck();
      else if(S.view === "view") runView();
    });
  }catch(e){
    $("files").innerHTML = `<div style="color:var(--danger);font-size:12px">${esc(e.message)}</div>`;
  }
}

/* ── 查漏查错 ── */
function renderCheck(){
  if(S.report) return paintReport();
  $("main").innerHTML = `<div class="empty"><span class="big">🌐</span>
    <b>左边选一个翻译表</b>
    <span style="font-size:12.5px">会查出：占位符漏了 / 漏翻 / 整列错位 / 原文重复</span></div>`;
}
async function runCheck(){
  if(!S.file) return;
  $("main").innerHTML = `<div class="empty">分析中…（大表要几秒）</div>`;
  const d = await post("/api/analyze", {path: S.file, sheet: S.sheet || null});
  if(!d.ok){ $("main").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  S.report = d; paintReport();
}

function paintReport(){
  const d = S.report;
  $("stat").textContent = `${d.rows_checked} 行 × ${d.langs.length} 语言`;
  const all = d.issues || [];
  const F = {
    all: all,
    crit: all.filter(x => x.kind === "占位符不一致"),
    mis: all.filter(x => x.kind === "疑似行错位"),
    warn: all.filter(x => x.kind === "漏翻"),
    dup: all.filter(x => x.kind === "原文重复"),
  };
  const rows = (F[S.filter] || all).slice(0, 400);

  let h = `<div class="kpis">
    <div class="kpi"><div class="k">原文行数</div><div class="v">${d.rows_checked}</div></div>
    <div class="kpi"><div class="k">占位符错</div>
      <div class="v" style="color:${F.crit.length?"var(--danger)":"var(--t3)"}">${F.crit.length}</div></div>
    <div class="kpi"><div class="k">疑似错位</div>
      <div class="v" style="color:${F.mis.length?"#7c3aed":"var(--t3)"}">${F.mis.length}</div></div>
    <div class="kpi"><div class="k">漏翻</div>
      <div class="v" style="color:${F.warn.length?"var(--warn)":"var(--t3)"}">${F.warn.length}</div></div>
    <div class="kpi"><div class="k">原文重复</div><div class="v">${F.dup.length}</div></div>
  </div>`;

  h += `<h4 style="margin:0 0 10px">各语言完成度</h4><div class="langs">` +
    d.langs.map(l => `<div class="lang">
      <div class="top"><span class="nm">${esc(l.name)}</span>
        <span class="pc" style="color:${l.done_pct>=99?"var(--ok)":l.done_pct>=80?"var(--warn)":"var(--danger)"}">
          ${l.done_pct}%</span></div>
      <div class="bar"><i class="${l.done_pct<80?"low":""}" style="width:${l.done_pct}%"></i></div>
      <div class="sub">${l.total} 条${l.empty?` · 漏 ${l.empty}`:""}${l.ph_bad?` · 占位符错 ${l.ph_bad}`:""}</div>
    </div>`).join("") + `</div>`;

  h += `<div class="filters">
    ${[["all","全部"],["crit","占位符不一致"],["mis","疑似行错位"],
       ["warn","漏翻"],["dup","原文重复"]].map(([k,n]) =>
      `<button data-f="${k}" class="${S.filter===k?"on":""}">${n} ${F[k].length}</button>`).join("")}
    <span style="flex:1"></span>
    <span style="color:var(--t3);font-size:12px">显示前 400 条</span></div>`;

  h += rows.length ? `<table><thead><tr>
    <th style="width:7%">行</th><th style="width:11%">语言</th><th style="width:14%">问题</th>
    <th style="width:38%">原文</th><th style="width:30%">说明</th></tr></thead><tbody>
    ${rows.map(x => `<tr>
      <td class="num">${x.row}</td>
      <td>${esc(x.lang)}</td>
      <td><span class="tag ${x.kind==="疑似行错位"?"t-mis":
        x.level==="critical"?"t-crit":x.level==="warn"?"t-warn":"t-info"}">${esc(x.kind)}</span></td>
      <td class="txt">${esc(x.text)}</td>
      <td style="font-size:12px;color:var(--t2)">${esc(x.detail)}</td>
    </tr>`).join("")}</tbody></table>`
    : `<div class="empty">✅ 这一类没有发现问题</div>`;

  h += `<div style="color:var(--t3);font-size:12px;line-height:1.9;margin-top:14px">
    <b>占位符不一致</b>：最危险的一类 —— 译文里少了 <code>@SITE@</code> / <code>{0}</code>
    这类占位符，App 上会显示成断句。<br>
    <b>疑似行错位</b>：整列复制粘贴时少了一行，后面全串位。报告会指出这一格"像是哪一行的译文"。<br>
    <b>漏翻</b>：某个语言的格子是空的。</div>`;
  $("main").innerHTML = h;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    S.filter = b.dataset.f; paintReport();
  });
}

/* ── 看表 ── */
function renderView(){
  $("main").innerHTML = `<div class="empty"><span class="big">📊</span>
    <b>左边选一个文件</b><span style="font-size:12.5px">可以翻页、跨列搜索</span></div>`;
}
async function runView(q){
  if(!S.file) return;
  const d = await post("/api/page", {path: S.file, sheet: S.sheet || null,
    offset: 0, limit: 200, query: q || ""});
  if(!d.ok){ $("main").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
  $("stat").textContent = `${d.total} 行`;
  $("main").innerHTML = `
    <div style="display:flex;gap:9px;margin-bottom:13px;align-items:center;flex-wrap:wrap">
      ${S.sheets.length > 1 ? `<select id="sheet" style="width:auto">
        ${S.sheets.map(s => `<option${s===d.sheet?" selected":""}>${esc(s)}</option>`).join("")}
      </select>` : `<span style="font-size:13px;color:var(--t2)">表：${esc(d.sheet)}</span>`}
      <input id="q" placeholder="跨列搜索…" style="flex:1;min-width:180px">
      <button class="b" id="btnQ">搜索</button>
      <span style="color:var(--t3);font-size:12px">共 ${d.total} 行，显示前 ${d.rows.length}</span>
    </div>
    <table><thead><tr><th style="width:56px">行</th>
      ${d.header.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
      ${d.rows.map(([ln, cells]) => `<tr><td class="num">${ln}</td>
        ${cells.map(c => `<td class="txt">${esc(String(c).slice(0, 160))}</td>`).join("")}
      </tr>`).join("")}</tbody></table>`;
  const go = () => runView($("q").value);
  $("btnQ").onclick = go;
  $("q").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  if($("sheet")) $("sheet").onchange = () => { S.sheet = $("sheet").value; runView(); };
}

/* ── 对比两版 ── */
function renderDiff(){
  $("main").innerHTML = `
    <div class="empty" style="padding:40px 20px">
      <span class="big">🔀</span><b>对比两个版本的翻译表</b>
      <span style="font-size:12.5px">找出：只在旧版有的 / 只在新版有的 / 改过的</span>
      <div style="margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
        <input id="da" placeholder="旧版文件完整路径" style="width:min(420px,40vw)">
        <input id="db" placeholder="新版文件完整路径" style="width:min(420px,40vw)">
        <button class="b pri" id="btnDiff">对比</button>
      </div>
      <div style="color:var(--t3);font-size:11.5px;margin-top:12px">
        提示：左边选中的文件是 <code>${esc(S.file ? S.file.split("/").pop() : "（未选）")}</code>
      </div>
      <div style="margin-top:8px"><button class="b" id="fillA">用左边选中的当旧版</button></div>
    </div>`;
  if(S.file) $("da").value = S.file;
  $("fillA").onclick = () => { $("da").value = S.file; };
  $("btnDiff").onclick = async () => {
    const a = $("da").value.trim(), b = $("db").value.trim();
    if(!a || !b) return toast("两个路径都要填");
    $("main").innerHTML = `<div class="empty">对比中…</div>`;
    const d = await post("/api/diff", {a, b, sheet: S.sheet || null});
    if(!d.ok){ $("main").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
    $("main").innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="k">只在旧版</div>
          <div class="v" style="color:${d.counts["只在A"]?"var(--danger)":"var(--t3)"}">${d.counts["只在A"]}</div></div>
        <div class="kpi"><div class="k">只在新版</div>
          <div class="v" style="color:var(--brand)">${d.counts["只在B"]}</div></div>
        <div class="kpi"><div class="k">有改动</div><div class="v">${d.counts["有改动"]}</div></div>
      </div>
      ${d.only_b.length ? `<h4>只在新版（新增的文案）</h4><table><tbody>
        ${d.only_b.slice(0,60).map(k => `<tr><td class="txt">${esc(k)}</td></tr>`).join("")}
      </tbody></table>` : ""}
      ${d.changed.length ? `<h4>有改动的</h4><table><thead><tr>
        <th style="width:26%">原文</th><th style="width:12%">列</th>
        <th style="width:31%">旧版</th><th style="width:31%">新版</th></tr></thead><tbody>
        ${d.changed.slice(0,80).map(c => `<tr>
          <td class="txt">${esc(c.key)}</td><td>${esc(c.col)}</td>
          <td class="txt">${esc(c.a)}</td><td class="txt">${esc(c.b)}</td></tr>`).join("")}
      </tbody></table>` : ""}
      ${d.only_a.length ? `<h4>只在旧版（被删掉的）</h4><table><tbody>
        ${d.only_a.slice(0,60).map(k => `<tr><td class="txt">${esc(k)}</td></tr>`).join("")}
      </tbody></table>` : ""}`;
  };
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  S.view = b.dataset.v; render();
  if(S.view === "view" && S.file) runView();
  if(S.view === "check" && S.file && !S.report) runCheck();
});
boot();
</script>
</body>
</html>
