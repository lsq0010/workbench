<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仓库总览</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#1f9d55;--brand-soft:#e8f7ee;--brand-line:#c6e9d5;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;
    --danger:#d23b3b;--danger-soft:#fdecec;
    --sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 2px 8px rgba(16,24,40,.07);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
         box-shadow:var(--sh1);z-index:5}
  .bar{display:flex;align-items:center;gap:9px;padding:0 18px;height:54px}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#1f9d55,#63c98d)}
  .spacer{flex:1}
  .stat{color:var(--t2);font-size:12.5px}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--text);transition:all .13s}
  button:hover{background:#f7f8fa}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.pri:hover{background:#178047}
  button:disabled{opacity:.45;cursor:not-allowed}
  input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;background:var(--panel);color:var(--text);outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

  main{flex:1;overflow:auto;padding:18px 22px 60px}
  .wrap{max-width:1240px;margin:0 auto}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:3px 12px;font-size:12px;color:var(--t2);box-shadow:var(--sh1);cursor:pointer}
  .chip b{color:var(--text);font-weight:650}
  .chip.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}

  .repo{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;margin-bottom:10px;box-shadow:var(--sh1);transition:box-shadow .13s}
  .repo:hover{box-shadow:var(--sh2)}
  .repo.dirty{border-left:3px solid var(--warn)}
  .repo.alert{border-left:3px solid var(--danger);background:#fffafa}
  .repo.clean{border-left:3px solid var(--ok);opacity:.86}
  .r1{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .nm{font-weight:650;font-size:14.5px;min-width:150px}
  .br{font-family:var(--mono);font-size:11.5px;background:var(--brand-soft);color:var(--brand);
    border-radius:6px;padding:2px 9px;max-width:330px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .bd{font-size:11.5px;border-radius:999px;padding:2px 10px;font-weight:600}
  .b-dirty{background:var(--warn-soft);color:var(--warn)}
  .b-clean{background:var(--ok-soft);color:var(--ok)}
  .b-ab{background:var(--brand-soft);color:var(--brand)}
  .b-alert{background:var(--danger-soft);color:var(--danger)}
  .b-stash{background:#f1f3f6;color:var(--t2)}
  .r2{display:flex;align-items:center;gap:12px;margin-top:7px;color:var(--t3);font-size:12px;
    flex-wrap:wrap}
  .r2 .sub{flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r2 .pn{font-family:var(--mono);font-size:11.5px;color:var(--t3);direction:rtl;
    max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts{display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--soft)}
  .acts button{font-size:11.5px;padding:4px 10px;color:var(--t2)}
  .acts button:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
  .detail{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;margin-top:10px;font-family:var(--mono);font-size:11.5px;
    white-space:pre-wrap;max-height:300px;overflow:auto;line-height:1.6}
  .empty{text-align:center;padding:60px 20px;color:var(--t2)}
  .empty .big{font-size:42px;opacity:.4;display:block;margin-bottom:12px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><i></i>仓库总览</span>
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <button id="btnFetchAll">全部 fetch</button>
    <button id="btnPick">仓库管理</button>
    <button class="pri" id="btnReload">刷新</button>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { repos: [], filter: "all", view: "list", picked: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2000); }

async function load(){
  if(S.view === "manage") return loadManage();
  $("view").innerHTML = `<div class="empty">扫描仓库…</div>`;
  try{
    const d = await api("/api/repos");
    S.repos = d.repos;
    render(d.seconds);
  }catch(e){ $("view").innerHTML = `<div class="empty">失败：${esc(e.message)}</div>`; }
}

function counts(){
  const r = S.repos.filter(x => !x.broken);
  return {
    total: r.length,
    dirty: r.filter(x => x.changed > 0).length,
    clean: r.filter(x => x.changed === 0).length,
    alert: r.filter(x => x.conflicts || x.merging || x.rebasing).length,
    ab: r.filter(x => x.ahead || x.behind).length,
  };
}

function render(sec){
  const c = counts();
  let rows = S.repos.filter(r => !r.broken);
  if(S.filter === "dirty") rows = rows.filter(r => r.changed > 0);
  else if(S.filter === "clean") rows = rows.filter(r => r.changed === 0);
  else if(S.filter === "ab") rows = rows.filter(r => r.ahead || r.behind);
  else if(S.filter === "alert") rows = rows.filter(r => r.conflicts || r.merging || r.rebasing);

  let h = `<div class="chips">
    <span class="chip ${S.filter==="all"?"on":""}" data-f="all">全部 <b>${c.total}</b></span>
    <span class="chip ${S.filter==="dirty"?"on":""}" data-f="dirty">有改动 <b>${c.dirty}</b></span>
    <span class="chip ${S.filter==="ab"?"on":""}" data-f="ab">需同步 <b>${c.ab}</b></span>
    ${c.alert ? `<span class="chip ${S.filter==="alert"?"on":""}" data-f="alert"
      style="color:var(--danger)">⚠️ 要注意 <b>${c.alert}</b></span>` : ""}
    <span class="chip ${S.filter==="clean"?"on":""}" data-f="clean">干净 <b>${c.clean}</b></span>
    <span style="flex:1"></span>
    <span style="color:var(--t3);font-size:12px">扫描用时 ${sec}s</span>
  </div>`;

  if(!rows.length){
    h += `<div class="empty"><span class="big">✅</span><b>没有符合条件的仓库</b></div>`;
    $("view").innerHTML = h; bind(); return;
  }
  h += rows.map(r => {
    const alert = r.conflicts || r.merging || r.rebasing;
    const cls = alert ? "alert" : (r.changed > 0 ? "dirty" : "clean");
    const badges = [];
    if(r.conflicts) badges.push(`<span class="bd b-alert">${r.conflicts} 个冲突</span>`);
    if(r.merging) badges.push(`<span class="bd b-alert">合并中</span>`);
    if(r.rebasing) badges.push(`<span class="bd b-alert">变基中</span>`);
    if(r.changed) badges.push(`<span class="bd b-dirty">${r.changed} 处改动</span>`);
    else badges.push(`<span class="bd b-clean">干净</span>`);
    if(r.ahead || r.behind)
      badges.push(`<span class="bd b-ab">${r.ahead?"↑"+r.ahead:""}${r.behind?"↓"+r.behind:""}</span>`);
    if(r.stashes) badges.push(`<span class="bd b-stash">stash ${r.stashes}</span>`);
    return `<div class="repo ${cls}" data-path="${esc(r.path)}">
      <div class="r1">
        <span class="nm">${esc(r.name)}</span>
        <span class="br" title="${esc(r.branch)}">${esc(r.branch)}</span>
        <span class="badges">${badges.join("")}</span>
      </div>
      <div class="r2">
        <span class="sub">${esc(r.last_date||"")} ${esc(r.last_subject||"")}</span>
        <span class="pn">${esc(r.path)}</span>
      </div>
      <div class="acts">
        <button data-fetch="${esc(r.path)}">fetch</button>
        <button data-detail="${esc(r.path)}">看详情</button>
        <button data-open="${esc(r.path)}">打开目录</button>
        <button data-copy="${esc(r.path)}">复制路径</button>
      </div>
      <div class="detail" id="d-${esc(r.path).replace(/[^a-zA-Z0-9]/g,"_")}" style="display:none"></div>
    </div>`;
  }).join("");

  $("view").innerHTML = h;
  const cc = counts();
  $("stat").textContent = `${cc.total} 个仓库 · ${cc.dirty} 个有改动`
    + (cc.alert ? ` · ⚠️ ${cc.alert} 个要处理` : "");
  bind();
}

function bind(){
  document.querySelectorAll("[data-f]").forEach(el => el.onclick = () => {
    S.filter = el.dataset.f; load();
  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => {
    await post("/api/open", {path: b.dataset.open}); toast("已打开目录");
  });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("路径已复制"));
  });
  document.querySelectorAll("[data-fetch]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "fetch 中…";
    const r = await post("/api/fetch", {path: b.dataset.fetch});
    toast(r.ok ? `fetch 完成（${r.seconds}s）` : "fetch 失败");
    await load();
  });
  document.querySelectorAll("[data-detail]").forEach(b => b.onclick = async () => {
    const path = b.dataset.detail;
    const id = "d-" + path.replace(/[^a-zA-Z0-9]/g, "_");
    const box = document.getElementById(id);
    if(box.style.display === "block"){ box.style.display = "none"; return; }
    box.style.display = "block"; box.textContent = "读取中…";
    try{
      const d = await api("/api/detail?path=" + encodeURIComponent(path));
      box.textContent =
        (d.status ? "── 工作区改动 ──\n" + d.status + "\n\n" : "工作区干净\n\n")
        + "── 最近提交 ──\n" + d.log + "\n\n"
        + "── 分支 ──\n" + d.branches
        + (d.stash ? "\n\n── stash ──\n" + d.stash : "");
    }catch(e){ box.textContent = "读取失败：" + e.message; }
  });
}

/* ── 仓库管理 ── */
async function loadManage(){
  S.view = "manage";
  const [c, d] = await Promise.all([api("/api/repos"), api("/api/discover")]);
  const cur = c.repos.filter(r => !r.broken).map(r => r.path);
  $("view").innerHTML = `
    <div class="chips"><span class="chip">已加入 <b>${cur.length}</b> 个</span>
      <span class="chip">自动发现 <b>${d.found.length}</b> 个</span>
      <span style="flex:1"></span>
      <button class="pri" id="btnBack">返回总览</button></div>
    <div class="repo"><div style="font-weight:620;margin-bottom:9px">手动添加路径</div>
      <div style="display:flex;gap:8px">
        <input id="newPath" placeholder="/Users/you/path/to/repo" style="flex:1">
        <button class="pri" id="btnAdd">添加</button></div></div>
    ${d.found.map(p => {
      const has = cur.includes(p);
      return `<div class="repo ${has?"clean":""}">
        <div class="r1"><span class="nm">${esc(p.split("/").pop())}</span>
          <span class="badges">${has
            ? `<span class="bd b-clean">已加入</span>
               <button data-del="${esc(p)}" style="font-size:11.5px;padding:3px 9px">移出</button>`
            : `<button data-add="${esc(p)}" class="pri" style="font-size:11.5px;padding:3px 9px">加入</button>`}
          </span></div>
        <div class="r2"><span class="pn">${esc(p)}</span></div></div>`;
    }).join("")}`;
  $("btnBack").onclick = () => { S.view = "list"; load(); };
  const save = async list => { await post("/api/config", {repos: list}); loadManage(); };
  document.querySelectorAll("[data-add]").forEach(b =>
    b.onclick = () => save([...cur, b.dataset.add]));
  document.querySelectorAll("[data-del]").forEach(b =>
    b.onclick = () => save(cur.filter(x => x !== b.dataset.del)));
  $("btnAdd").onclick = () => {
    const v = $("newPath").value.trim();
    if(!v) return toast("填个路径");
    save([...cur, v]);
  };
}

$("btnReload").onclick = () => { S.view = "list"; load(); };
$("btnPick").onclick = () => { if(S.view === "manage"){ S.view="list"; load(); } else loadManage(); };
$("btnFetchAll").onclick = async () => {
  const r = S.repos.filter(x => !x.broken && x.remote);
  if(!r.length) return toast("没有配置远端的仓库");
  if(!confirm(`对 ${r.length} 个仓库执行 git fetch？\n（只更新远端引用，不改工作区）`)) return;
  $("btnFetchAll").disabled = true;
  let ok = 0;
  for(const repo of r){
    $("btnFetchAll").textContent = `fetch ${ok+1}/${r.length}`;
    const res = await post("/api/fetch", {path: repo.path});
    if(res.ok) ok++;
  }
  $("btnFetchAll").disabled = false;
  $("btnFetchAll").textContent = "全部 fetch";
  toast(`完成 ${ok}/${r.length}`);
  load();
};
load();
</script>
</body>
</html>
