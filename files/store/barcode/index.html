<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>条形码工具</title>
<style>
  :root{--bg:#f4f5f7;--panel:#fff;--line:#e4e7ec;--soft:#f1f3f6;--text:#15171c;
    --t2:#586172;--t3:#98a1ad;--brand:#0f766e;--brand-soft:#e9f6f4;--brand-line:#bfe3de;
    --ok:#12894f;--ok-soft:#e8f7ee;--danger:#c2410c;--warn:#a16207;--warn-soft:#fdf6e3;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  body{margin:0;font:14px/1.6 var(--sans);background:var(--bg);color:var(--text)}
  header{background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10}
  .bar{display:flex;align-items:center;gap:10px;padding:0 20px;height:56px;
    max-width:1220px;margin:0 auto;flex-wrap:wrap}
  .brand{font-weight:660;font-size:15.5px;display:flex;align-items:center;gap:9px}
  .brand .mk{width:25px;height:25px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:13px;background:var(--brand);color:#fff}
  .spacer{flex:1}
  .stat{color:var(--t3);font-size:12.5px;font-family:var(--mono)}
  button.b{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;color:var(--text)}
  button.b:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
  button.b.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:620}
  button.b:disabled{opacity:.45;cursor:not-allowed}
  main{max-width:1220px;margin:22px auto 80px;padding:0 20px;
    display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:940px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:17px 19px;margin-bottom:16px}
  .card h3{margin:0 0 13px;font-size:14.5px;font-weight:650;display:flex;
    align-items:center;gap:8px}
  .fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .fmt{border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;
    font-size:13px;font-weight:600;background:var(--panel)}
  .fmt:hover{border-color:var(--brand-line);background:var(--brand-soft)}
  .fmt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .fmt .h{display:block;font-weight:400;font-size:11px;color:var(--t3);
    margin-top:2px;line-height:1.4}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:5px}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;
    font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    background:var(--panel);color:var(--text);outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{resize:vertical;min-height:74px;font-family:var(--mono);font-size:12.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1;min-width:0}
  .row .nb{flex:none}
  .preview{background:#fff;border:1px solid var(--line);border-radius:11px;
    padding:18px;text-align:center;min-height:170px;display:flex;
    align-items:center;justify-content:center;overflow:auto}
  .preview img{max-width:100%;height:auto;display:block;margin:0 auto}
  .meta{color:var(--t3);font-size:12px;font-family:var(--mono);margin-top:10px;
    text-align:center}
  .err{background:#fdf2ec;border:1px solid #f3d0bb;border-radius:9px;padding:11px 14px;
    color:var(--danger);font-size:13px}
  .okbox{background:var(--ok-soft);border:1px solid #bfe6cf;border-radius:9px;
    padding:11px 14px;color:var(--ok);font-size:13px}
  .hint{color:var(--t3);font-size:12.5px;line-height:1.8}
  .hist{font-size:12px;padding:6px 0;border-bottom:1px solid var(--soft);
    display:flex;gap:8px;align-items:center}
  .hist .d{flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .hist a{color:var(--brand);text-decoration:none;flex:none}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
  code{font-family:var(--mono);font-size:11.5px;background:var(--soft);
    padding:1px 5px;border-radius:4px}
  .tabs2{display:flex;gap:6px;margin-bottom:14px}
  .tabs2 button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--t2)}
  .tabs2 button.on{background:var(--brand);border-color:var(--brand);color:#fff;
    font-weight:600}
</style>
</head>
<body>

<header><div class="bar">
  <span class="brand"><span class="mk">▥</span>条形码工具</span>
  <span class="stat" id="stat"></span>
  <span class="spacer"></span>
  <button class="b" id="btnVerify">跑一遍验证</button>
</div></header>

<main>
  <div>
    <div class="card">
      <h3>选码制</h3>
      <div class="fmts" id="fmts"></div>
      <div class="hint" id="fmthint" style="margin-top:11px"></div>
    </div>

    <div class="card">
      <div class="tabs2">
        <button data-m="one" class="on">单个</button>
        <button data-m="batch">批量</button>
        <button data-m="decode">扫图</button>
      </div>

      <div id="modeOne">
        <div class="fld">
          <label>内容</label>
          <input type="text" id="data" placeholder="SF1234567890" autocomplete="off">
        </div>
        <div class="row">
          <div class="fld"><label>条宽（px）</label>
            <input type="number" id="module" value="2" min="1" max="8"></div>
          <div class="fld"><label>高度（px）</label>
            <input type="number" id="height" value="90" min="30" max="300"></div>
          <div class="fld"><label>条色</label>
            <input type="text" id="bar" value="#000000"></div>
          <div class="fld"><label>底色</label>
            <input type="text" id="bg" value="#ffffff"></div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label style="display:flex;align-items:center;gap:7px;font-size:13px;
            color:var(--t2);cursor:pointer;flex:none">
            <input type="checkbox" id="showtext" checked style="width:auto">
            图下显示内容</label>
        </div>
      </div>

      <div id="modeBatch" style="display:none">
        <div class="fld">
          <label>内容（一行一个，或用逗号隔开，最多 200 个）</label>
          <textarea id="batchdata" placeholder="SF1000000001&#10;SF1000000002&#10;SF1000000003"></textarea>
        </div>
        <div class="row">
          <div class="fld"><label>条宽（px）</label>
            <input type="number" id="bmodule" value="2" min="1" max="8"></div>
          <div class="fld"><label>高度（px）</label>
            <input type="number" id="bheight" value="80" min="30" max="300"></div>
          <div class="fld"><label>存成</label>
            <select id="bsaveas"><option value="png">PNG</option>
              <option value="svg">SVG（矢量）</option></select></div>
        </div>
      </div>

      <div id="modeDecode" style="display:none">
        <div class="fld">
          <label>图片路径（拖进来或粘路径）</label>
          <input type="text" id="decpath" placeholder="/Users/你/Desktop/某张条码图.png">
        </div>
        <div class="hint">用 macOS 的 Vision 扫（和 iPhone 相机同源）——
          能扫出来说明这张图真能用。</div>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="b pri nb" id="btnGo">生成</button>
        <button class="b nb" id="btnSave" style="display:none">保存到磁盘</button>
        <span class="spacer"></span>
      </div>
      <div id="msg" style="margin-top:12px"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h3>预览</h3>
      <div class="preview" id="preview">
        <span class="hint">选个码制、输内容，点生成</span>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="card">
      <h3>最近生成的</h3>
      <div id="hist"><span class="hint">还没有</span></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { fmt: "code128", formats: [], mode: "one", last: null, busy: false };
let OUTDIR = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p, {method:"POST",
  headers:{"Content-Type":"application/json"}, body: JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2600); }

async function boot(){
  try{
    const st = await api("/api/status");
    S.formats = st.formats;
    OUTDIR = st.outdir || "";
    $("stat").textContent = `${st.formats.length} 种码制` + (st.pil ? "" : "（缺 PIL，不能生成）");
    $("fmts").innerHTML = st.formats.map(f =>
      `<button class="fmt ${f.id===S.fmt?"on":""}" data-f="${esc(f.id)}">
        ${esc(f.name)}<span class="h">${esc(f.hint)}</span></button>`).join("");
    document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
      S.fmt = b.dataset.f;
      document.querySelectorAll("[data-f]").forEach(x =>
        x.classList.toggle("on", x === b));
      const f = S.formats.find(x => x.id === S.fmt);
      $("fmthint").innerHTML = f ? `示例：<code>${esc(f.sample)}</code>` : "";
      if(!$("data").value) $("data").value = f ? f.sample : "";
      renderHist(st.history);
    });
    const f0 = S.formats[0];
    if(f0){ $("data").value = f0.sample;
      $("fmthint").innerHTML = `示例：<code>${esc(f0.sample)}</code>`; }
    renderHist(st.history);
  }catch(e){ $("fmts").innerHTML = `<span class="hint" style="color:var(--danger)">
    ${esc(e.message)}</span>`; }

  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    S.mode = b.dataset.m;
    document.querySelectorAll("[data-m]").forEach(x =>
      x.classList.toggle("on", x === b));
    $("modeOne").style.display = S.mode === "one" ? "" : "none";
    $("modeBatch").style.display = S.mode === "batch" ? "" : "none";
    $("modeDecode").style.display = S.mode === "decode" ? "" : "none";
    $("btnSave").style.display = "none";
    $("btnGo").textContent = S.mode === "decode" ? "扫这张图" : "生成";
    $("msg").innerHTML = "";
  });
  $("btnGo").onclick = go;
  $("btnSave").onclick = save;
  $("data").addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  $("btnVerify").onclick = runVerify;
  ["data","module","height","bar","bg","showtext"].forEach(id => {
    const el = $(id); if(el) el.addEventListener("change", () => { if(S.last) go(); });
  });
  const dp = $("decpath");
  if(dp){
    ["dragenter","dragover"].forEach(ev => dp.addEventListener(ev, e => {
      e.preventDefault(); dp.style.borderColor = "var(--brand)"; }));
    ["dragleave","drop"].forEach(ev => dp.addEventListener(ev, e => {
      e.preventDefault(); dp.style.borderColor = ""; }));
    dp.addEventListener("drop", e => {
      const f = [...(e.dataTransfer.files||[])][0];
      if(f && f.path){ dp.value = f.path; go(); }
      else toast("浏览器拿不到文件路径 —— 直接把路径粘进来");
    });
  }
}

function renderHist(rows){
  if(!rows || !rows.length){ $("hist").innerHTML = `<span class="hint">还没有</span>`; return; }
  $("hist").innerHTML = rows.map(r =>
    `<div class="hist">
      <span class="d" title="${esc(r.data)}">${esc(r.data.slice(0,22))}</span>
      <span style="color:var(--t3);font-family:var(--mono);font-size:11px">${esc(r.format)}</span>
      <a href="#" data-h="${esc(r.file)}">下载</a>
    </div>`).join("");
  document.querySelectorAll("[data-h]").forEach(a => a.onclick = async e => {
    e.preventDefault();
    const r = await post("/api/reveal", {path: OUTDIR + "/" + a.dataset.h});
    if(!r.ok) toast(r.error || "打不开");
  });
}

async function go(){
  if(S.busy) return;
  S.busy = true;
  const btn = $("btnGo");
  btn.disabled = true;
  $("msg").innerHTML = "";
  try{
    if(S.mode === "decode"){
      const p = $("decpath").value.trim();
      if(!p){ toast("先填图片路径"); }
      else{
        $("preview").innerHTML = `<span class="spin"></span>扫图中…`;
        const r = await post("/api/decode", {path: p});
        if(!r.ok){
          $("preview").innerHTML = `<span class="hint">—</span>`;
          $("msg").innerHTML = `<div class="err">${esc(r.error)}</div>`;
        }else{
          $("preview").innerHTML = `<div style="text-align:left;width:100%">
            ${r.items.map(x => `<div style="padding:7px 0;border-bottom:1px solid var(--soft)">
              <b style="color:var(--brand)">${esc(x.symbology)}</b>
              <div style="font-family:var(--mono);font-size:13px;margin-top:3px;
                word-break:break-all">${esc(x.data)}</div></div>`).join("")}</div>`;
          $("meta").textContent = `扫到 ${r.count} 个`;
          $("preview").innerHTML = `<div style="text-align:left;width:100%">
            ${r.items.map(x => `<div style="padding:7px 0;border-bottom:1px solid var(--soft)">
              <b style="color:var(--brand)">${esc(x.symbology)}</b>
              <div style="font-family:var(--mono);font-size:13px;margin-top:3px;
                word-break:break-all">${esc(x.data)}</div></div>`).join("")}</div>`;
          $("msg").innerHTML = `<div class="okbox">✅ 扫出来了 —— 这张图能用</div>`;
        }
      }
      S.busy = false; btn.disabled = false; return;
    }
    if(S.mode === "batch"){
      const raw = $("batchdata").value.trim();
      if(!raw){ toast("先填内容"); S.busy = false; btn.disabled = false; return; }
      $("preview").innerHTML = `<span class="spin"></span>批量生成中…`;
      const r = await post("/api/batch", {format: S.fmt, data: raw,
        module: +$("bmodule").value, height: +$("bheight").value,
        save_as: $("bsaveas").value});
      if(!r.ok){
        $("msg").innerHTML = `<div class="err">${esc(r.error)}</div>`;
        $("preview").innerHTML = `<span class="hint">—</span>`;
      }else{
        $("msg").innerHTML = `<div class="okbox">✅ 生成了 ${r.count} 张，
          存在 <code>${esc(r.outdir)}</code>
          ${(r.failed||[]).length ? `<br>⚠️ ${r.failed.length} 个失败：` +
            esc(r.failed.map(x=>x.data+"（"+x.error+"）").join("；")) : ""}</div>`;
        $("preview").innerHTML = `<div style="text-align:left;width:100%">
          ${r.items.slice(0,8).map(x => `<div style="font-family:var(--mono);
            font-size:12px;padding:3px 0">${esc(x.name)}</div>`).join("")}
          ${r.items.length > 8 ? `<div class="hint">…还有 ${r.items.length-8} 张</div>`:""}</div>`;
        $("meta").textContent = `${r.count} 张`;
        await refreshHist();
      }
      S.busy = false; btn.disabled = false; return;
    }
    // 单个
    const d = $("data").value;
    if(!d){ toast("先填内容"); S.busy = false; btn.disabled = false; return; }
    const r = await post("/api/build", {format: S.fmt, data: d,
      module: +$("module").value, height: +$("height").value,
      bar: $("bar").value, bg: $("bg").value, show_text: $("showtext").checked});
    if(!r.ok){
      $("preview").innerHTML = `<span class="hint">—</span>`;
      $("meta").textContent = "";
      $("msg").innerHTML = `<div class="err">${esc(r.error)}</div>`;
      $("btnSave").style.display = "none";
    }else{
      S.last = r;
      $("preview").innerHTML = `<img src="data:image/png;base64,${r.png_b64}" alt="">`;
      $("meta").textContent =
        `${r.name} · ${r.bits} 个窄条 · ${r.width_units} 单位宽 · ${(r.bytes/1024).toFixed(1)} KB`;
      $("msg").innerHTML = "";
      $("btnSave").style.display = "";
    }
  }catch(e){
    $("msg").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
  S.busy = false; btn.disabled = false;
}

async function save(){
  if(!S.last) return;
  const svg = confirm("存成 SVG（矢量，打印不糊）？\n\n确定 = SVG，取消 = PNG");
  try{
    const r = await post("/api/save", {format: S.fmt, data: S.last.data,
      save_as: svg ? "svg" : "png", module: +$("module").value,
      height: +$("height").value, bar: $("bar").value, bg: $("bg").value,
      show_text: $("showtext").checked});
    if(r.ok){ toast("存好了：" + r.name); await refreshHist(); }
    else toast(r.error || "保存失败");
  }catch(e){ toast("失败：" + e.message); }
}

async function refreshHist(){
  try{ const st = await api("/api/status"); renderHist(st.history); }catch(e){}
}

async function runVerify(){
  const b = $("btnVerify");
  b.disabled = true; b.textContent = "验证中…（跑 20 项，要几十秒）";
  $("msg").innerHTML = `<div class="hint"><span class="spin"></span>
    正在把每种码制「生成 → 用 macOS Vision 扫回 → 对比」…</div>`;
  try{
    const r = await post("/api/verify", {});
    $("msg").innerHTML = r.ok
      ? `<div class="okbox">✅ ${esc(r.summary)}<pre style="margin:8px 0 0;
          font-size:11.5px;white-space:pre-wrap;color:var(--text)">${esc(r.output)}</pre></div>`
      : `<div class="err">验证没过：<pre style="margin:6px 0 0;font-size:11.5px;
          white-space:pre-wrap">${esc(r.output||r.error||"")}</pre></div>`;
  }catch(e){ $("msg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  b.disabled = false; b.textContent = "跑一遍验证";
}

boot();
</script>
</body>
</html>
