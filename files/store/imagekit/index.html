<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片工具箱</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#db2777;--brand-soft:#fdf0f6;--brand-line:#fbd0e3;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;--danger:#d23b3b;
    --sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 2px 8px rgba(16,24,40,.07);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
  .bar{display:flex;align-items:center;gap:9px;padding:0 18px;height:54px}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#db2777,#f9a8d4)}
  .spacer{flex:1}
  .stat{color:var(--t2);font-size:12.5px}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--text);transition:all .13s}
  button:hover{background:#f7f8fa}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.pri:hover{background:#be185d}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;background:var(--panel);color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

  main{flex:1;display:flex;min-height:0;overflow:hidden}
  #side{width:326px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:16px}
  #side h4{margin:0 0 9px;font-size:12px;color:var(--t3);text-transform:uppercase;
    letter-spacing:.06em}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
  .fld input,.fld select{width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);
    margin-bottom:9px;cursor:pointer}
  .chk input{accent-color:var(--brand);width:auto}
  .warnbox{background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;border-radius:9px;
    padding:10px 12px;font-size:12px;margin-bottom:12px}
  .danger{background:#fdecec;border-color:#f6c9c9;color:#a02c2c}
  #main{flex:1;overflow:auto;padding:20px 24px 60px;min-width:0}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 16px;
    box-shadow:var(--sh1);min-width:120px}
  .kpi .k{color:var(--t3);font-size:11.5px}
  .kpi .v{font-size:20px;font-weight:650;font-family:var(--mono);margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh1)}
  th{text-align:left;color:var(--t3);font-weight:600;font-size:11.5px;padding:9px 13px;
     background:var(--panel2);border-bottom:1px solid var(--line)}
  td{padding:8px 13px;border-bottom:1px solid var(--soft)}
  tr:last-child td{border-bottom:none}
  .nm{font-family:var(--mono);font-size:12px;word-break:break-all}
  .saved{color:var(--ok);font-weight:600}
  .grew{color:var(--warn)}
  .empty{text-align:center;padding:70px 20px;color:var(--t2)}
  .empty .big{font-size:44px;opacity:.4;display:block;margin-bottom:13px}
  .empty b{color:var(--text);display:block;font-size:15px;margin-bottom:7px}
  .browser{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--sh2);width:min(560px,92vw);max-height:440px;
    overflow:auto;display:none}
  .browser .hd{padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--soft);
    font-family:var(--mono);font-size:12px;position:sticky;top:0;display:flex;gap:8px;
    align-items:center}
  .browser .it{padding:8px 14px;border-bottom:1px solid var(--soft);cursor:pointer;font-size:13px}
  .browser .it:hover{background:var(--brand-soft)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><i></i>图片工具箱</span>
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <button id="btnHistory">处理历史</button>
  </div>
</header>

<main>
  <aside id="side">
    <h4>① 选目录</h4>
    <div class="fld">
      <input id="folder" value="" placeholder="/Users/you/Desktop">
      <div style="display:flex;gap:6px;margin-top:6px">
        <button id="btnBrowse" style="flex:1">浏览…</button>
        <button id="btnScan" style="flex:1">扫描</button>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="recursive"> 包含子目录</label>

    <h4 style="margin-top:18px">② 怎么处理</h4>
    <div class="row2">
      <div class="fld"><label>最长边（像素）</label>
        <input id="maxw" type="number" value="1600" placeholder="0=不改"></div>
      <div class="fld"><label>最高（像素）</label>
        <input id="maxh" type="number" value="0" placeholder="0=不改"></div>
    </div>
    <div class="row2">
      <div class="fld"><label>转成格式</label>
        <select id="fmt">
          <option value="">保持原格式</option>
          <option value="JPEG">JPEG（照片/截图，最小）</option>
          <option value="PNG">PNG（要透明）</option>
          <option value="WEBP">WebP</option>
        </select></div>
      <div class="fld"><label>质量 <span id="qv">82</span></label>
        <input id="quality" type="range" min="40" max="100" value="82" style="padding:0"></div>
    </div>
    <label class="chk"><input type="checkbox" id="overwrite"> <b style="color:var(--danger)">
      覆盖原图</b>（不推荐）</label>

    <div id="notice"></div>
    <button class="pri" id="btnGo" style="width:100%;margin-top:6px">开始处理</button>
    <div style="color:var(--t3);font-size:11.5px;margin-top:9px;line-height:1.6">
      默认输出到 <code style="font-family:var(--mono)">_processed/</code> 子目录，<b>不动原图</b>。
    </div>
  </aside>
  <div id="main">
    <div class="empty"><span class="big">🖼</span><b>选个目录，点「扫描」</b>
      <span style="font-size:12.5px">先看有多少张、多大，再决定怎么处理</span></div>
  </div>
</main>

<div class="browser" id="browser"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { scan: null, result: null, browsePath: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => {
  const r = await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(b||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
};
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2000); }
function human(n){
  if(n === null || n === undefined) return "—";
  for(const u of ["B","KB","MB","GB"]){ if(n < 1024) return (u==="B"?n.toFixed(0):n.toFixed(1))+" "+u; n/=1024; }
  return n.toFixed(1)+" TB";
}

async function boot(){
  const st = await api("/api/status");
  $("stat").textContent = st.pil ? `Pillow ${st.pil_version}` : "缺 Pillow";
  if(!st.pil){
    $("notice").innerHTML = `<div class="warnbox danger"><b>没装 Pillow</b><br>
      压缩和缩放需要它：<br>
      <code style="font-family:var(--mono)">python3 -m pip install --user Pillow</code><br>
      扫描仍然可用（只读尺寸和大小）。</div>`;
  }
  // 默认从桌面开始
  $("folder").value = "/Users/" + "master/Desktop";
}
$("quality").addEventListener("input", () => $("qv").textContent = $("quality").value);

async function scan(){
  const folder = $("folder").value.trim();
  if(!folder) return toast("先填个目录");
  $("main").innerHTML = `<div class="empty">扫描中…</div>`;
  try{
    const d = await api(`/api/scan?folder=${encodeURIComponent(folder)}&recursive=${
      $("recursive").checked ? 1 : 0}`);
    S.scan = d;
    paintScan();
  }catch(e){
    $("main").innerHTML = `<div class="empty"><span class="big">📁</span>
      <b>${esc(e.message)}</b><span style="font-size:12.5px">换个目录试试</span></div>`;
  }
}

function paintScan(){
  const d = S.scan;
  if(!d.count){
    $("main").innerHTML = `<div class="empty"><span class="big">🖼</span>
      <b>这个目录里没有图片</b>
      <span style="font-size:12.5px">支持 jpg / png / webp / heic / tiff / bmp / gif</span></div>`;
    return;
  }
  const big = d.items.filter(x => x.bytes > 2 * 1024 * 1024).length;
  $("main").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">图片数</div><div class="v">${d.count}</div></div>
      <div class="kpi"><div class="k">总大小</div><div class="v">${d.total_human}</div></div>
      <div class="kpi"><div class="k">超过 2MB</div>
        <div class="v" style="color:${big?"var(--warn)":"var(--t3)"}">${big}</div></div>
    </div>
    <table><thead><tr><th style="width:44%">文件</th><th style="width:16%">尺寸</th>
      <th style="width:14%">大小</th><th style="width:26%">格式</th></tr></thead><tbody>
      ${d.items.slice(0,120).map(x => x.error
        ? `<tr><td class="nm">${esc(x.name)}</td><td colspan="3"
             style="color:var(--danger)">${esc(x.error)}</td></tr>`
        : `<tr><td class="nm">${esc(x.name)}</td>
             <td class="nm">${x.w}×${x.h}</td>
             <td class="nm">${human(x.bytes)}</td>
             <td class="nm">${esc(x.format||"?")} ${x.mode||""}</td></tr>`).join("")}
    </tbody></table>
    ${d.count > 120 ? `<div style="color:var(--t3);font-size:12px;margin-top:9px">
      只显示前 120 张，处理时会全部处理</div>` : ""}`;
}

$("btnGo").onclick = async () => {
  const folder = $("folder").value.trim();
  if(!folder) return toast("先填个目录");
  const body = {
    folder, recursive: $("recursive").checked, overwrite: $("overwrite").checked,
    max_width: +$("maxw").value || 0, max_height: +$("maxh").value || 0,
    fmt: $("fmt").value, quality: +$("quality").value,
  };
  if(body.overwrite && !confirm("会直接覆盖原图，确定？\n（建议先不勾，处理完满意再换）")) return;
  if(!body.max_width && !body.max_height && !body.fmt){
    return toast("什么都没设置：填个最长边、或选个格式");
  }
  $("btnGo").disabled = true; $("btnGo").textContent = "处理中…";
  try{
    const r = await post("/api/process", body);
    if(r.error){ toast(r.error); }
    else{ S.result = r; paintResult(); }
  }catch(e){ toast("失败：" + e.message); }
  $("btnGo").disabled = false; $("btnGo").textContent = "开始处理";
};

function paintResult(){
  const r = S.result;
  const okCount = r.results.filter(x => x.ok).length;
  const savedPct = r.before ? Math.round(r.saved / r.before * 100) : 0;
  $("main").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">处理</div><div class="v">${okCount}</div></div>
      <div class="kpi"><div class="k">处理前</div><div class="v">${r.before_human}</div></div>
      <div class="kpi"><div class="k">处理后</div><div class="v">${r.after_human}</div></div>
      <div class="kpi"><div class="k">省了</div>
        <div class="v" style="color:${r.saved>0?"var(--ok)":"var(--t3)"}">${r.saved_human}
        <span style="font-size:12px">(${savedPct}%)</span></div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:13px;align-items:center">
      <button id="btnReveal">打开输出目录</button>
      <span style="color:var(--t3);font-size:12px;font-family:var(--mono)">
        ${esc(r.overwrite ? "（已覆盖原图）" : r.outdir)}</span>
      <span class="spacer" style="flex:1"></span>
      <span style="color:var(--t3);font-size:12px">用时 ${r.seconds}s</span>
    </div>
    <table><thead><tr><th style="width:42%">文件</th><th style="width:16%">处理前</th>
      <th style="width:16%">处理后</th><th style="width:13%">变化</th>
      <th style="width:13%">新尺寸</th></tr></thead><tbody>
      ${r.results.map(x => x.ok ? `<tr>
        <td class="nm">${esc(x.name)}</td>
        <td class="nm">${human(x.before)}</td>
        <td class="nm">${human(x.after)}</td>
        <td class="${x.ratio>0?"saved":"grew"}">${x.ratio>0?"-":"+"}${Math.abs(x.ratio)}%</td>
        <td class="nm">${x.w}×${x.h}</td></tr>`
        : `<tr><td class="nm">${esc(x.name)}</td><td colspan="4"
             style="color:var(--danger)">${esc(x.error)}</td></tr>`).join("")}
    </tbody></table>`;
  $("btnReveal").onclick = async () => {
    await post("/api/reveal", {path: r.overwrite ? $("folder").value : r.outdir});
    toast("已打开");
  };
}

$("btnScan").onclick = scan;
$("folder").addEventListener("keydown", e => { if(e.key === "Enter") scan(); });

$("btnHistory").onclick = async () => {
  const d = await api("/api/history");
  if(!d.history.length){
    $("main").innerHTML = `<div class="empty"><span class="big">🕘</span><b>还没有处理记录</b></div>`;
    return;
  }
  $("main").innerHTML = `<h2 style="margin:0 0 12px;font-size:16px">处理历史</h2>
    <table><thead><tr><th style="width:18%">时间</th><th style="width:30%">目录</th>
      <th style="width:10%">张数</th><th style="width:14%">处理前</th>
      <th style="width:14%">处理后</th><th style="width:14%">省</th></tr></thead><tbody>
      ${d.history.map(x => `<tr>
        <td class="nm">${esc(x.ts)}</td>
        <td class="nm">${esc((x.folder||"").split("/").pop())}</td>
        <td class="nm">${x.count}</td>
        <td class="nm">${human(x.before)}</td>
        <td class="nm">${human(x.after)}</td>
        <td class="saved">${human(x.saved)}</td></tr>`).join("")}
    </tbody></table>`;
};

/* ── 目录浏览 ── */
$("btnBrowse").onclick = async e => {
  e.stopPropagation();
  const b = $("browser");
  b.style.display = "block"; b.style.left = "40px"; b.style.top = "90px";
  await browse($("folder").value.trim() || "/Users");
};
async function browse(path){
  const b = $("browser");
  try{
    const d = await api("/api/folder?path=" + encodeURIComponent(path));
    S.browsePath = d.path;
    b.innerHTML = `<div class="hd">
      <button id="btnUp" style="padding:3px 9px;font-size:12px">↑ 上级</button>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(d.path)}</span>
      <button id="btnPickHere" class="pri" style="padding:3px 10px;font-size:12px">用这个目录</button>
    </div>` + (d.dirs.length ? d.dirs.map(x =>
      `<div class="it" data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join("")
      : `<div class="it" style="color:var(--t3)">（没有子目录）</div>`);
    $("btnUp").onclick = ev => { ev.stopPropagation(); browse(d.parent); };
    $("btnPickHere").onclick = ev => {
      ev.stopPropagation();
      $("folder").value = S.browsePath; b.style.display = "none"; scan();
    };
    b.querySelectorAll("[data-p]").forEach(el => el.onclick = ev => {
      ev.stopPropagation(); browse(el.dataset.p);
    });
  }catch(err){
    b.innerHTML = `<div class="it" style="color:var(--danger)">${esc(err.message)}</div>`;
  }
}
document.addEventListener("click", e => {
  const b = $("browser");
  if(b.style.display === "block" && !b.contains(e.target) && e.target.id !== "btnBrowse")
    b.style.display = "none";
});

boot().then(scan);
</script>
</body>
</html>
