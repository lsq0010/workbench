<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 周报</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#7c5cff;--brand-soft:#f1edff;--brand-line:#ddd3ff;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;--danger:#d23b3b;
    --sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 2px 8px rgba(16,24,40,.07);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
         box-shadow:var(--sh1);z-index:5}
  .bar{display:flex;align-items:center;gap:9px;padding:0 18px;height:54px;flex-wrap:wrap}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#7c5cff,#b3a1ff)}
  .spacer{flex:1}
  .stat{color:var(--t2);font-size:12.5px}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--text);
    transition:all .13s}
  button:hover{background:#f7f8fa}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.pri:hover{background:#6a49f0}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;background:var(--panel);color:var(--text);outline:none}
  select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .seg{display:flex;gap:3px;background:#eceef2;padding:3px;border-radius:9px}
  .seg button{border:none;background:transparent;border-radius:6px;padding:5px 13px;
    font-size:12.5px;color:var(--t2);font-weight:500}
  .seg button.on{background:var(--panel);color:var(--brand);font-weight:600;box-shadow:var(--sh1)}

  main{flex:1;overflow:auto;padding:20px 24px 60px}
  .wrap{max-width:1080px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:16px 18px;margin-bottom:15px;box-shadow:var(--sh1)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:3px 12px;font-size:12px;color:var(--t2);box-shadow:var(--sh1)}
  .chip b{color:var(--text);font-weight:650}
  h2{margin:0 0 10px;font-size:16px;font-weight:650}
  h3{margin:16px 0 8px;font-size:14px;font-weight:650}
  .repohead{display:flex;align-items:center;gap:9px;margin:18px 0 9px;
    padding-bottom:7px;border-bottom:1px solid var(--line)}
  .repohead .nm{font-weight:650;font-size:15px}
  .repohead .cnt{background:var(--brand-soft);color:var(--brand);border-radius:999px;
    padding:1px 10px;font-size:12px;font-weight:600}
  .brhead{font-family:var(--mono);font-size:12.5px;color:var(--brand);margin:12px 0 7px;
    background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:7px;
    padding:2px 9px;display:inline-block}
  .cm{display:flex;gap:9px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--soft)}
  .cm:last-child{border-bottom:none}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:600;flex:none;
    min-width:46px;text-align:center}
  .k-新功能{background:var(--ok-soft);color:var(--ok)}
  .k-修复{background:#fdecec;color:var(--danger)}
  .k-优化{background:#eef3ff;color:#2f6df6}
  .k-移除{background:var(--warn-soft);color:var(--warn)}
  .k-其他,.k-杂项,.k-文档,.k-测试,.k-重构{background:#f1f3f6;color:var(--t3)}
  .cm .tx{flex:1;font-size:13px}
  .cm .hs{font-family:var(--mono);font-size:11.5px;color:var(--t3)}
  .cm .dt{font-size:11.5px;color:var(--t3);font-family:var(--mono)}
  .md{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:15px 17px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;
    word-break:break-word;max-height:62vh;overflow:auto;font-family:var(--sans)}
  .md h1,.md h2,.md h3{font-size:15px;margin:14px 0 7px;font-weight:700}
  .md h1:first-child{margin-top:0}
  .md code{background:#e9ecf1;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:12px}
  .md ul{padding-left:20px;margin:6px 0}
  .md li{margin:3px 0}
  .md strong{font-weight:700}
  .empty{text-align:center;padding:60px 20px;color:var(--t2)}
  .empty .big{font-size:42px;opacity:.4;display:block;margin-bottom:12px}
  .empty b{color:var(--text);display:block;font-size:15px;margin-bottom:6px}
  .warnbox{background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;
    border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:15px}
  .repo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
  .repo:last-child{border-bottom:none}
  .repo .p{font-family:var(--mono);font-size:12px;color:var(--t2);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
  .repo .b{font-family:var(--mono);font-size:11.5px;color:var(--brand);background:var(--brand-soft);
    border-radius:5px;padding:1px 7px}
  .repo .x{border:none;background:none;color:var(--t3);cursor:pointer;font-size:15px;
    padding:2px 6px;border-radius:6px}
  .repo .x:hover{background:#fdecec;color:var(--danger)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99;box-shadow:var(--sh2)}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--brand);
    vertical-align:-2px;animation:bk 1s steps(2) infinite;margin-left:2px}
  @keyframes bk{50%{opacity:0}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><i></i>Git 周报</span>
    <div class="seg" id="seg">
      <button data-r="week" class="on">本周</button>
      <button data-r="lastweek">上周</button>
      <button data-r="month">近 30 天</button>
      <button data-r="days:7">近 7 天</button>
    </div>
    <input id="author" placeholder="按提交人过滤（可留空）" style="width:190px">
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <button id="btnRepos">仓库设置</button>
    <button class="pri" id="btnAI">AI 润色成周报</button>
    <button id="btnSave">保存</button>
    <button id="btnReload">刷新</button>
  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { range:"week", report:null, md:"", view:"report", aiText:"", busy:false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2000); }

async function boot(){
  try{
    const st = await api("/api/status");
    $("stat").textContent = `${st.repos} 个仓库` + (st.ai_ready ? ` · AI ${st.ai_model}` : " · AI 未配置");
    if(st.author) $("author").value = st.author;
  }catch(e){}
  await reload();
}

async function reload(){
  if(S.view === "repos") return renderRepos();
  $("view").innerHTML = `<div class="empty">读取 git 提交…</div>`;
  try{
    const q = new URLSearchParams({range:S.range});
    const a = $("author").value.trim();
    if(a) q.set("author", a);
    const d = await api("/api/report?" + q);
    S.report = d.report; S.md = d.markdown; S.aiText = "";
    renderReport();
  }catch(e){
    $("view").innerHTML = `<div class="empty">失败：${esc(e.message)}</div>`;
  }
}

function renderReport(){
  const r = S.report;
  if(!r || !r.total_commits){
    $("view").innerHTML = `<div class="empty"><span class="big">📭</span>
      <b>这个时间段没有提交</b>
      换个时间范围，或检查「仓库设置」里有没有加对仓库</div>`;
    return;
  }
  const types = Object.entries(r.by_type).sort((a,b) => b[1]-a[1]);
  let h = `<div class="chips">
    <span class="chip">提交 <b>${r.total_commits}</b> 次</span>
    <span class="chip">仓库 <b>${r.repos.filter(x=>x.count).length}</b> 个</span>
    ${types.map(([k,v]) => `<span class="chip">${esc(k)} <b>${v}</b></span>`).join("")}
    <span class="chip" style="color:var(--t3)">${esc(r.since.slice(0,10))} ~ ${esc(r.until.slice(0,10))}</span>
  </div>`;
  h += `<div style="display:flex;gap:8px;margin-bottom:14px">
    <button id="tabMd" class="${S.aiText?'':'pri'}">${S.aiText?'原始草稿':'结构化草稿'}</button>
    ${S.aiText?`<button id="tabAI" class="pri">AI 周报</button>`:""}
  </div>`;
  h += `<div class="card"><div class="md" id="mdBox">${
    S.aiText ? md2html(S.aiText) : md2html(S.md)}</div></div>`;
  h += `<h2 style="margin-top:22px">提交明细</h2>`;
  for(const repo of r.repos){
    if(!repo.count) continue;
    h += `<div class="repohead"><span class="nm">${esc(repo.name)}</span>
      <span class="cnt">${repo.count} 次</span>
      <span style="color:var(--t3);font-size:12px">${esc(repo.branch)}</span></div>`;
    for(const b of repo.branches || []){
      h += `<div class="brhead">${esc(b.branch)} · ${b.count} 次</div>`;
      for(const x of [...b.feats, ...b.fixes, ...b.others]){
        h += `<div class="cm">
          <span class="tag k-${esc(x.kind)}">${esc(x.kind)}</span>
          <span class="tx">${esc(x.text)}</span>
          <span class="hs">${esc(x.hash)}</span>
          <span class="dt">${esc((x.date||"").slice(0,10))}</span></div>`;
      }
    }
  }
  $("view").innerHTML = h;
  if($("tabMd")) $("tabMd").onclick = () => { S.aiText=""; renderReport(); };
  if($("tabAI")) $("tabAI").onclick = () => renderReport();
}

/* 极简 Markdown 渲染（够用即可，安全第一：先转义） */
function md2html(src){
  const codes = [];
  let t = String(src||"").replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,c) => {
    codes.push(c.replace(/\n$/,"")); return `\u0000${codes.length-1}\u0000`;
  });
  const e = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const out = [];
  for(let line of t.split("\n")){
    line = e(line)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    line = line.replace(/\u0000(\d+)\u0000/g, (m,i) => `<pre style="background:#1c1f26;color:#e6e9ef;border-radius:8px;padding:10px;overflow:auto">${e(codes[+i])}</pre>`);
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ out.push(`<h${Math.min(h[1].length,3)}>${h[2]}</h${Math.min(h[1].length,3)}>`); continue; }
    if(/^\s*[-*]\s+/.test(line)){ out.push(`<li>${line.replace(/^\s*[-*]\s+/,"")}</li>`); continue; }
    if(/^\s*---+\s*$/.test(line)){ out.push("<hr>"); continue; }
    if(line.trim()===""){ out.push(""); continue; }
    out.push(`<p>${line}</p>`);
  }
  return out.join("\n").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
}

async function renderRepos(){
  S.view = "repos";
  $("view").innerHTML = `<div class="empty">读取仓库…</div>`;
  const d = await api("/api/repos");
  const disc = await api("/api/discover");
  $("view").innerHTML = `
    <div class="card">
      <h2>已加入的仓库（${d.repos.length}）</h2>
      ${d.repos.length ? d.repos.map(r => `<div class="repo">
        <span style="font-weight:600;min-width:130px">${esc(r.name)}</span>
        ${r.broken ? `<span style="color:var(--danger);font-size:12px">${esc(r.broken)}</span>`
                   : `<span class="b">${esc(r.branch)}</span>
                      <span class="p">${esc(r.path)}</span>
                      <span style="color:var(--t3);font-size:11.5px">${esc(r.last_commit||"")}</span>`}
        <button class="x" data-del="${esc(r.path)}" title="移出列表">✕</button>
      </div>`).join("") : `<div style="color:var(--t3);font-size:13px">还没有仓库</div>`}
    </div>
    <div class="card">
      <h2>自动发现（${disc.count} 个）</h2>
      <div style="color:var(--t2);font-size:12.5px;margin-bottom:10px">
        扫的是桌面 / 文稿 / 项目目录，找到的 git 仓库。</div>
      ${disc.new.length ? `<button class="pri" id="btnAddAll">把新发现的 ${disc.new.length} 个全部加入</button>`
                        : `<span style="color:var(--ok);font-size:13px">✅ 都已在列表里</span>`}
      <div style="margin-top:12px">${disc.found.map(p => `<div class="repo">
        <span class="p" style="direction:ltr">${esc(p)}</span>
        ${d.repos.some(r=>r.path===p) ? `<span style="color:var(--ok);font-size:12px">已加入</span>`
          : `<button data-add="${esc(p)}">加入</button>`}</div>`).join("")}</div>
    </div>
    <div class="card">
      <h2>提交人过滤</h2>
      <div style="color:var(--t2);font-size:12.5px;margin-bottom:9px">
        填了只统计这个人的提交；留空则统计全部。</div>
      <input id="author2" value="${esc($("author").value)}" style="width:260px">
      <button id="btnSaveAuthor">保存</button>
    </div>`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const repos = d.repos.map(r => r.path).filter(p => p !== b.dataset.del);
    await post("/api/config", {repos}); toast("已移出"); renderRepos();
  });
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => {
    const repos = [...d.repos.map(r => r.path), b.dataset.add];
    await post("/api/config", {repos}); toast("已加入"); renderRepos();
  });
  if($("btnAddAll")) $("btnAddAll").onclick = async () => {
    const repos = [...d.repos.map(r => r.path), ...disc.new];
    await post("/api/config", {repos}); toast(`已加入 ${disc.new.length} 个`); renderRepos();
  };
  $("btnSaveAuthor").onclick = async () => {
    await post("/api/config", {author: $("author2").value.trim()});
    $("author").value = $("author2").value.trim();
    toast("已保存"); 
  };
}

/* ── 事件 ── */
document.querySelectorAll("#seg button").forEach(b => {
  b.onclick = () => {
    S.range = b.dataset.r;
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
    S.view = "report"; reload();
  };
});
$("author").addEventListener("change", () => {
  post("/api/config", {author: $("author").value.trim()}); reload();
});
$("btnReload").onclick = () => { S.view = "report"; reload(); };
$("btnRepos").onclick = () => { if(S.view === "repos"){ S.view="report"; reload(); } else renderRepos(); };

$("btnAI").onclick = () => {
  if(S.busy) return;
  S.busy = true;
  const btn = $("btnAI"); btn.disabled = true; btn.textContent = "AI 写作中…";
  S.aiText = "";
  $("view").innerHTML = `<div class="card"><div class="md" id="mdBox">
    <span class="cursor"></span></div></div>`;
  fetch("/api/polish", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({range:S.range, author:$("author").value.trim()})})
  .then(async r => {
    if(!r.ok){
      const j = await r.json().catch(()=>({error:"HTTP "+r.status}));
      toast(j.error || "AI 失败"); S.busy=false; btn.disabled=false;
      btn.textContent="AI 润色成周报"; renderReport(); return;
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while(true){
      const {done, value} = await rd.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split("\n\n"); buf = parts.pop();
      for(const blk of parts){
        const m = blk.match(/^data: (.+)$/m);
        if(!m) continue;
        try{
          const o = JSON.parse(m[1]);
          if(o.t && !o.t.includes("<!-- done -->")){
            S.aiText += o.t;
            const box = $("mdBox");
            if(box) box.innerHTML = md2html(S.aiText) + '<span class="cursor"></span>';
          }
        }catch(e){}
      }
    }
    S.busy = false; btn.disabled = false; btn.textContent = "AI 润色成周报";
    renderReport();
    toast("AI 周报已生成");
  }).catch(e => {
    toast("AI 失败：" + e.message);
    S.busy=false; btn.disabled=false; btn.textContent="AI 润色成周报"; renderReport();
  });
};

$("btnSave").onclick = async () => {
  const j = await post("/api/save", {range:S.range, markdown:S.aiText || S.md});
  toast(j.ok ? "已保存：" + j.path.split("/").pop() : "保存失败");
};

boot();
</script>
</body>
</html>
