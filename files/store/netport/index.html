<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口与进程</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#fff;--panel2:#fafbfc;--line:#e6e8ec;--soft:#f0f1f4;
    --text:#16181d;--t2:#5b6472;--t3:#98a1ad;
    --brand:#0d9488;--brand-soft:#e6f7f5;--brand-line:#bfe8e3;
    --ok:#12894f;--ok-soft:#e7f6ee;--warn:#a9670a;--warn-soft:#fdf3e3;--danger:#d23b3b;
    --sh1:0 1px 2px rgba(16,24,40,.05);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfd3da;border:3px solid transparent;
    background-clip:content-box;border-radius:8px}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 var(--sans);background:var(--bg);color:var(--text);
       display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
  .bar{display:flex;align-items:center;gap:9px;padding:0 18px;height:54px;flex-wrap:wrap}
  .brand{font-weight:650;font-size:15.5px;display:flex;align-items:center;gap:8px;flex:none}
  .brand i{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,#0d9488,#5eead4)}
  .spacer{flex:1}
  .stat{color:var(--t2);font-size:12.5px}
  button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
    padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--text);transition:all .13s}
  button:hover{background:#f7f8fa}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.pri:hover{background:#0b7c72}
  input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;
    padding:7px 12px;background:var(--panel);color:var(--text);outline:none;width:230px}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  main{flex:1;overflow:auto;padding:18px 22px 60px}
  .wrap{max-width:1200px;margin:0 auto}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:3px 12px;font-size:12px;color:var(--t2);box-shadow:var(--sh1)}
  .chip b{color:var(--text);font-weight:650}
  .ans{background:var(--ok-soft);border:1px solid #bfe6cf;color:#0d6b3e;border-radius:11px;
    padding:13px 16px;font-size:13.5px;margin-bottom:15px}
  .ans.busy{background:var(--warn-soft);border-color:#fde68a;color:#92400e}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh1)}
  th{text-align:left;color:var(--t3);font-weight:600;font-size:11.5px;padding:9px 13px;
     background:var(--panel2);border-bottom:1px solid var(--line);position:sticky;top:0}
  td{padding:9px 13px;border-bottom:1px solid var(--soft);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbfc}
  .ports{font-family:var(--mono);font-weight:650;color:var(--brand);font-size:12.5px}
  .ports .p{display:inline-block;background:var(--brand-soft);border-radius:5px;
    padding:1px 7px;margin-right:4px}
  .nm{font-weight:600}
  .mono{font-family:var(--mono);font-size:11.5px;color:var(--t2);word-break:break-all}
  .known{font-size:11.5px;color:var(--brand);background:var(--brand-soft);border-radius:5px;
    padding:1px 7px;display:inline-block;margin-top:3px}
  .kill{border:none;background:none;color:var(--t3);cursor:pointer;font-size:12px;
    padding:3px 8px;border-radius:6px}
  .kill:hover{background:#fdecec;color:var(--danger)}
  .empty{text-align:center;padding:60px 20px;color:var(--t2)}
  .empty .big{font-size:44px;opacity:.4;display:block;margin-bottom:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);
    background:#1c1f26;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;
    transition:all .2s;pointer-events:none;font-size:13px;z-index:99}
  .toast.on{opacity:.97;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand"><i></i>端口与进程</span>
    <input id="q" placeholder="查端口，例如 8080">
    <button class="pri" id="btnCheck">查这个端口</button>
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <button id="btnScan">刷新</button>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="ans"></div>
    <div class="chips" id="chips"></div>
    <div id="table"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const S = { rows: [], known: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async p => { const r = await fetch(p); if(!r.ok) throw new Error(r.status); return r.json(); };
const post = async (p,b) => (await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})})).json();
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2000); }

async function scan(){
  $("table").innerHTML = `<div class="empty">扫描中…</div>`;
  try{
    const d = await api("/api/scan");
    S.rows = d.rows;
    render(d.seconds);
  }catch(e){ $("table").innerHTML = `<div class="empty">失败：${esc(e.message)}</div>`; }
}

function render(sec){
  const ports = new Set();
  S.rows.forEach(r => r.ports.forEach(p => ports.add(p)));
  $("stat").textContent = `${S.rows.length} 个进程 · ${ports.size} 个端口` + (sec ? ` · ${sec}s` : "");
  $("chips").innerHTML = `
    <span class="chip">监听进程 <b>${S.rows.length}</b></span>
    <span class="chip">端口总数 <b>${ports.size}</b></span>
    <span class="chip">本机只在回环的 <b>${S.rows.filter(r => r.bind.every(b => b.startsWith("127.") || b === "[::1]")).length}</b></span>
    <span class="chip">对外开放的 <b>${S.rows.filter(r => r.bind.some(b => b === "*" || b === "0.0.0.0")).length}</b></span>`;
  $("table").innerHTML = S.rows.length ? `<table><thead><tr>
    <th style="width:15%">端口</th><th style="width:16%">项目</th>
    <th style="width:7%">PID</th><th style="width:9%">内存</th>
    <th style="width:8%">运行</th><th style="width:38%">命令</th>
    <th style="width:7%"></th></tr></thead><tbody>
    ${S.rows.map(r => `<tr>
      <td class="ports">${r.ports.slice(0,5).map(p => `<span class="p">${p}</span>`).join("")}
        ${r.ports.length > 5 ? `<span style="color:var(--t3)">+${r.ports.length-5}</span>` : ""}
        ${r.udp ? `<span style="color:var(--t3);font-size:10.5px">UDP</span>` : ""}</td>
      <td><span class="nm">${esc(r.project || "—")}</span>
        ${r.known ? `<div class="known">${esc(r.known)}</div>` : ""}</td>
      <td class="mono">${r.pid}</td>
      <td class="mono">${esc(r.mem || "—")}</td>
      <td class="mono">${esc(r.uptime || "—")}</td>
      <td class="mono" title="${esc(r.cwd||"")}">${esc(r.cmdline)}</td>
      <td><button class="kill" data-kill="${r.pid}" data-cmd="${esc(r.command)}"
        title="结束这个进程">结束</button></td></tr>`).join("")}
    </tbody></table>`
    : `<div class="empty"><span class="big">🔌</span><b>没有监听的进程</b></div>`;
  document.querySelectorAll("[data-kill]").forEach(b => b.onclick = async () => {
    const pid = b.dataset.kill;
    const r = S.rows.find(x => String(x.pid) === pid) || {};
    const what = `${r.project || r.command || "?"}（PID ${pid}）`
      + (r.ports ? `\n端口 ${r.ports.join(", ")}` : "")
      + (r.cmdline ? `\n${r.cmdline}` : "");
    if(!confirm(`结束这个进程？\n\n${what}\n\n会发 SIGTERM（和活动监视器"退出"一样，给它自己收尾的机会）。`))
      return;
    const res = await post("/api/kill", {pid: +pid});
    toast(res.ok ? res.message : ("失败：" + res.error));
    setTimeout(scan, 700);
  });
}

$("btnCheck").onclick = async () => {
  const p = parseInt($("q").value.trim(), 10);
  if(!p){ return toast("填个端口号"); }
  try{
    const d = await api("/api/check?port=" + p);
    if(d.free){
      $("ans").innerHTML = `<div class="ans">✅ 端口 <b>${p}</b> 现在空闲 —— 可以用</div>`;
    }else{
      const r = d.rows[0];
      $("ans").innerHTML = `<div class="ans busy">⚠️ 端口 <b>${p}</b> 被占用<br>
        <span style="font-size:12.5px">
        ${esc(r.project || r.command)}（PID ${r.pid}）${r.known ? " · " + esc(r.known) : ""}<br>
        <span style="font-family:var(--mono);font-size:11.5px">${esc(r.cmdline)}</span>
        ${r.cwd ? `<br><span style="font-family:var(--mono);font-size:11.5px;color:var(--t2)">
          工作目录 ${esc(r.cwd)}</span>` : ""}
        </span></div>`;
    }
  }catch(e){ toast("查询失败：" + e.message); }
};
$("q").addEventListener("keydown", e => { if(e.key === "Enter") $("btnCheck").click(); });
$("btnScan").onclick = scan;
scan();
</script>
</body>
</html>
